name: Deploy web application

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy to publish the web application
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s dist/index.html

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::118588069159:role/acomi-github-web-deploy
          aws-region: ap-south-1

      - name: Upload the verified build
        run: |
          set -euo pipefail
          aws s3 sync dist "s3://acomi-web-prod-118588069159" --only-show-errors

      - name: Publish on EC2
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command \
            --instance-ids i-0c0a259cad76fd191 \
            --document-name AWS-RunShellScript \
            --timeout-seconds 300 \
            --parameters commands="/usr/local/sbin/acomi-deploy-frontend.sh app" \
            --query Command.CommandId --output text)"
          for _ in $(seq 1 30); do
            status="$(aws ssm get-command-invocation --command-id "$command_id" --instance-id i-0c0a259cad76fd191 --query Status --output text 2>/dev/null || true)"
            case "$status" in
              Success) exit 0 ;;
              Failed|Cancelled|TimedOut) exit 1 ;;
            esac
            sleep 10
          done
          exit 1
